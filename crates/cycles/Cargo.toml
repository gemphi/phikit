[package]
name = "cycles"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Cycles in Rust: Blender's renderer ported top to bottom, session first. Each file names the Cycles file it comes from."

# Ported from Blender's Cycles (`intern/cycles`, Apache-2.0), layer by layer
# in Cycles' own order: session, integrator, scene, kernel. FLOW.md shows the
# render as these types run it; PLAN.md says which step is done.
[dependencies]
bytemuck = "1.18"
# Reads the reference images (PNG, EXR) the way oiiotool does; the workspace's own.
image = { workspace = true }
# The join reads a .blend through phiphx's SceneModel; only blender/model.rs names it.
phiphx = { path = "../phiphx", default-features = false }

# The unit tests are in `test.rs` beside the module they test (`foo.rs` has
# `foo/test.rs`), declared `#[cfg(test)] mod test;`.

[lints]
workspace = true

