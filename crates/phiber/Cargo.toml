[package]
name = "phiber"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["Phiace"]
description = "Phiber - Blender-like GPUI application built on BUIKit"

[lints]
workspace = true

[lib]
name = "phiber"
path = "src/lib.rs"

[dependencies]
phiphx = { path = "../phiphx" }
phiray = { path = "../phiray" }
exr = "1.74"
image = { workspace = true }
dirs = { workspace = true }
smallvec = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
theme = { workspace = true }
glam = "0.29"
byteorder = "1.5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytemuck = { version = "1.18", features = ["derive"] }
zstd = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }

[features]
default = ["phx-import"]
phx-import = []
gltf-import = ["phiphx/gltf-import"]
usd-import = []
usdz-import = ["phiphx/usdz-import"]
proptest = ["phiphx/proptest"]

[[bin]]
name = "phiber"
path = "src/main.rs"

[dev-dependencies]
proptest = { workspace = true }
# The save tests read their own output back, so they need the codecs too.
exr = "1.74"
image = { workspace = true }
dirs = { workspace = true }
phiphx = { path = "../phiphx" }
gpui = { workspace = true, features = ["test-support"] }
