[package]
name = "phiplay"
version = "0.1.0"
edition = "2024"
publish = false
description = "The game Phiber plays: five sports, their teams, kits, looks, themes and venues as declarative sets, and the play on phiecs."

[dependencies]
# The world the play runs in: players, the ball and the goals are words,
# what they do to each other relations, the phases conditions, and the
# game's logic systems by stage (`crates/phicore/phiecs`: phinet's phiecs
# core, kept in phikit so it needs no phinet folder).
phiecs = { path = "../phicore/phiecs" }
glam = "0.29"
