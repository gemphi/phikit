[package]
name = "zlog"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zlog.rs"

[features]
default = []

[dependencies]
# `std::time::Instant::now` panics on wasm32-unknown-unknown; web-time is
# std::time on every other target and performance.now() in the browser.
web-time.workspace = true
collections.workspace = true
chrono.workspace = true
log.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
