[package]
name = "phipro"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["Phiace"]
description = "phipro — a project bundle written from any asset phiphx can read"

[lints]
workspace = true

[lib]
name = "phipro"
path = "src/lib.rs"

[dependencies]
# The asset readers only. `phiphx`'s default `bui` feature pulls gpui in for
# its spatial cards, and a crate that writes files on disk has no business
# with a toolkit — so the dependency is the data half alone, which is what
# lets this crate build and test anywhere.
phiphx = { path = "../phiphx", default-features = false }
glam = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
