[package]
name = "appkit"
version = "0.1.0"
edition = "2024"
description = "The common layer every phi app stands on: pui, the UI kit, with its theme, its services and its assets"
publish = false

# src/ holds what is not the UI kit itself (theme, service, data, test);
# pui/ holds the kit; asset/ the icons every app shares. The gpui crates
# under gpu/, the glass crate among them (gpu/gpui_glass), are crates of their own.
[lib]
path = "src/lib.rs"

# The system window, the renderer and the text: Zed's gpui, under gpu/.
# Only src/screen names it. It picks the system from the target, so the
# desktop and the web need no feature.
[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Where the screen says what went wrong: a browser has no stderr.
log.workspace = true
# What decodes a picture's file: the crate gpui itself decodes with.
image.workspace = true
