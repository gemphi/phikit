<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiogy</title>
<!--
  The page Phiogy's browser build loads into. appkit's screen makes its own
  canvas and adds it to the body, so the page gives it a body as large as
  the window, loads the module, and says why when it cannot start.

  Build, from phikit:
    cargo build -p phiogy --lib --profile quick --target wasm32-unknown-unknown
    wasm-bindgen --target web --out-dir crates/appkit/app/phiogy/web/pkg target/wasm32-unknown-unknown/quick/phiogy.wasm
  Serve (a module cannot be loaded from a file):
    python -m http.server -d crates/appkit/app/phiogy/web
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f5f3; }
  #boot { position: fixed; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; font: 15px/1.6 system-ui, sans-serif; color: #1d1d1b; }
  #boot code { color: #7a7a75; }
</style>
<body>
  <div id="boot">Starting Phiogy</div>
  <script type="module">
    const boot = document.getElementById('boot');
    const stop = (html) => { boot.innerHTML = html; };
    // The renderer draws through WebGPU. Without it the page would stay
    // blank, so it says so instead.
    if (!navigator.gpu) {
      stop('Phiogy draws through <strong>WebGPU</strong>, which this browser does not have.');
    } else {
      try {
        const init = (await import('./pkg/phiogy.js')).default;
        await init();
        boot.remove();
      } catch (error) {
        console.error(error);
        stop('Phiogy could not start. The console has the detail.<br><br><code>' + String(error).replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;')) + '</code>');
      }
    }
  </script>
</body>
