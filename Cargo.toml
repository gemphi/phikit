gpui = { path = "crates/phigpu/gpui", default-features = false }
gpui_shared_string = { path = "crates/phigpu/gpui_shared_string" }
gpui_linux = { path = "crates/phigpu/gpui_linux", default-features = false }
gpui_macos = { path = "crates/phigpu/gpui_macos", default-features = false }
gpui_macros = { path = "crates/phigpu/gpui_macros" }
gpui_platform = { path = "crates/phigpu/gpui_platform", default-features = false }
# `default-features = false` turns off gpui_web's `multithreaded`, which
# pulls `wasm_thread`, which opens with
# `#![cfg_attr(target_arch = "wasm32", feature(stdarch_wasm_atomic_wait))]` —
# a nightly-only feature, so the whole wasm build fails on stable with E0554.
# Browser threads also need SharedArrayBuffer and COOP/COEP headers on
# whatever serves the page, so they are not free even on nightly. gpui_web's
# dispatcher is written both ways (`#[cfg(not(feature = "multithreaded"))]`)
# and `gpui_platform::single_threaded_web()` is the entry for this path, so
# the single-threaded build is a supported configuration, not a workaround.
# rayon already runs serially on wasm32 (its own documented fallback), so
# there is no worker pool going unused. Add the feature back, with a nightly
# toolchain, when the page is served with the headers that make it work.
gpui_web = { path = "crates/phigpu/gpui_web", default-features = false }
gpui_wgpu = { path = "crates/phigpu/gpui_wgpu" }
gpui_windows = { path = "crates/phigpu/gpui_windows", default-features = false }
gpui_util = { path = "crates/phigpu/gpui_util" }
http_client = { path = "crates/phicore/http_client" }
media = { path = "crates/phicore/media" }
mime = "0.3.17"
path = { path = "crates/phicore/path" }
perf = { path = "tooling/perf" }
refineable = { path = "crates/phicore/refineable" }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "e50e726ddd0292f6ef9de0dda6b90af4ed1fb66a", features = ["wav", "playback", "wav_output", "recording"] }
scheduler = { path = "crates/phicore/scheduler" }
sum_tree = { path = "crates/phicore/sum_tree" }
syntax_theme = { path = "crates/phiui/syntax_theme" }
theme = { path = "crates/phiui/theme" }
util = { path = "crates/phicore/util" }
util_macros = { path = "crates/phicore/util_macros" }

zlog = { path = "crates/phicore/zlog" }
ztracing = { path = "crates/phicore/ztracing" }
ztracing_macro = { path = "crates/phicore/ztracing_macro" }

