[workspace]
resolver = "2"
exclude = [
    # Phiace-specific crates that predate the zed vendoring. They live in
    # phiace/crates/ but are not part of the zed workspace graph — leaving
    # them here keeps their source available without letting cargo try to
    # build them alongside the vendored zed tree (they have their own,
    # non-zed workspace-dep set).
    "crates/apple",
    "crates/apple-macros",
    "crates/apple-mirror-tool",
]
members = [
    "crates/phiphx",
    "crates/phicore/collections",
    "crates/phigpu/gpui",
    "crates/phigpu/gpui_macros",
    "crates/phigpu/gpui_platform",
    "crates/phigpu/gpui_shared_string",
    "crates/phigpu/gpui_util",
    "crates/phigpu/gpui_windows",
    # gpui's wgpu renderer. A member so it keeps compiling: it is written,
    # it is clean, and nothing was building it — which is how a renderer
    # rots. It matters twice over. phiray is wgpu and gpui on Windows is
    # DirectX (`gpui_windows/directx_renderer.rs`), so today a traced frame
    # crosses two devices and has to go through the CPU to do it; one wgpu
    # device would make that copy unnecessary. And `gpui_web` renders
    # through this same crate, so the web build and the desktop fast path
    # are the same change. (`gpui_web` is wasm-only and cannot be a member
    # here; it is checked by building for wasm32-unknown-unknown.)
    "crates/phigpu/gpui_wgpu",
    "crates/phicore/http_client",
    "crates/phiber",
    # The game Phiber plays (`crates/phiplay`): its sports, teams, kits,
    # looks, themes and venues as declarative sets, and the play itself on
    # phiecs (`crates/phicore/phiecs`).
    "crates/phiplay",
    # The core of phinet's phiecs that phiber and phiplay run on, kept here
    # so phikit builds with no phinet folder beside it.
    "crates/phicore/phiecs",
    "crates/phiray",
    "crates/phipro",
    "crates/phicore/refineable",
    "crates/phicore/refineable/derive_refineable",
    "crates/phicore/scheduler",
    "crates/phicore/sum_tree",
    "crates/phiui/syntax_theme",
    "crates/phiui/theme",
    "crates/phicore/util_macros",
    "crates/phicore/zlog",
    "crates/phicore/ztracing",
    "crates/phicore/ztracing_macro",
]
default-members = ["crates/phiber"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#

phiber = { path = "crates/phiber" }
phipro = { path = "crates/phipro" }
collections = { path = "crates/phicore/collections", version = "0.1.0" }
compliance = { path = "tooling/compliance" }
console = "0.16"
