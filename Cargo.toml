[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop" }
# Zed's livekit, webrtc and notify patches (and msvc_spectre_libs, which only
# webrtc-sys pulled in) went with the voice and file-watching crates phikit
# does not vendor; cargo warned on every build that nothing used them.

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

# mirror configuration for crates compiled for the build platform
# (without this cargo will compile ~400 crates twice)
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

# "debug" is a reserved profile name.
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.build-override]
debug = "full"

[profile.dev.package]
# proc-macros start
derive_refineable = { opt-level = 3 }
util_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
# proc-macros end

taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }

# Every dependency optimised, even in a dev build. GPUI lays out and paints
# the whole window on every frame, and a zone drag or a window resize asks for
# a frame per mouse move. With everything unoptimised a frame cost ~40 ms (the
# Layout space) against ~11 ms with the dependencies optimised.
# `"*"` covers everything from the registry (wgpu, glam, image, the text
# stack); the workspace crates that do per-frame work are listed by name
# because `"*"` does not reach workspace members. The cost is paid once, on
# the first build; incremental rebuilds only recompile what changed.
"*" = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_windows = { opt-level = 3 }
gpui_shared_string = { opt-level = 3 }
gpui_util = { opt-level = 3 }
sum_tree = { opt-level = 3 }
scheduler = { opt-level = 3 }
phiray = { opt-level = 3 }
phiphx = { opt-level = 3 }
theme = { opt-level = 3 }
# Phiber itself stays unoptimised: it is the crate being edited, and at
# opt-level 0 a one-file change rebuilds in ~3 s against ~13 s at 3. Its own
# per-frame work is small enough not to need it.
phiber = { opt-level = 0 }
# Build single-source-file crates with cg=1 as it helps make `cargo build` of a whole workspace a bit faster
collections = { codegen-units = 1, opt-level = 3 }
refineable = { codegen-units = 1, opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# A release build for *looking at*, not for timing.
#
# `profile.release` is tuned for the render benchmarks: one codegen unit and
# thin LTO across the graph, which is where a ~23-minute rebuild of phiber
# goes. Nearly all of that is spent optimising code whose speed does not
# matter when the thing being checked is a panel, a header or a hotkey.
# This profile keeps `opt-level = 3`, so the viewport and the tracer are
# still usable, and gives up the whole-program optimisation that costs the
# minutes. Build it with `cargo build --profile quick -p phiber`.
#
# Never quote a render time from this profile — use `--release` for those.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = false

[profile.release.package]
phiber = { codegen-units = 16 }

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

declare_interior_mutable_const = "deny"

redundant_clone = "deny"
disallowed_methods = "deny"

# We currently do not restrict any style rules
# as it slows down shipping code to Zed.
#
# Running ./script/clippy can take several minutes, and so it's
# common to skip that step and let CI do it. Any unexpected failures
# (which also take minutes to discover) thus require switching back
# to an old branch, manual fixing, and re-pushing.
#
# In the future we could improve this by either making sure
# Zed can surface clippy errors in diagnostics (in addition to the
# rust-analyzer errors), or by having CI fix style nits automatically.
style = { level = "allow", priority = -1 }

# Individual rules that have violations in the codebase:
type_complexity = "allow"
let_underscore_future = "allow"

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

# Boolean expressions can be hard to read, requiring only the minimal form gets in the way
nonminimal_bool = "allow"

[workspace.metadata.cargo-machete]
ignored = [
    "bindgen",
    "cbindgen",
    "prost_build",
    "serde",
    "component",
    "documented",
    "sea-orm-macros",
]

# Dylint discovers our custom lints through this entry, so `cargo dylint --all`
# runs them without a `--path` argument. Removed with the vendored zed
# `tooling/` tree; re-add `libraries = [{ path = "tooling/lints" }]` if the
# lint suite is ever vendored back.
